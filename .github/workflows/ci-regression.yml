name: Dashboard regression checks

on:
  pull_request:
    branches: [devin/phase-1-3b-ci-regression-tests]
  push:
    branches: [devin/phase-1-3b-ci-regression-tests]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/devin/phase-1-3b-ci-regression-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
